[package]
name = "aplot-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Standalone Aplot server entry point"

[[bin]]
name = "aplotd"
path = "src/main.rs"

[dependencies]
aplot-core = { path = "../aplot-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
